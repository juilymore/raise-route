y="329.5" text-anchor="middle" font-size="15" fill="#14284b">Mon + Thu 03:00 UTC (Vercel</text><text x="337.66666666666663" y="347.5" text-anchor="middle" font-size="15" fill="#14284b">Cron) or Run now</text><rect x="492.3333333333333" y="277.5" width="253.33333333333331" height="112" rx="14" fill="#dcebfd" stroke="#2f80d8" stroke-width="2.5"/><text x="619" y="329.5" text-anchor="middle" font-size="15" fill="#14284b">Starts one run: one task per</text><text x="619" y="347.5" text-anchor="middle" font-size="15" fill="#14284b">investor (50)</text><rect x="492.3333333333333" y="414.5" width="253.33333333333331" height="112" rx="14" fill="#dcebfd" stroke="#2f80d8" stroke-width="2.5"/><text x="619" y="466.5" text-anchor="middle" font-size="15" fill="#14284b">Investor names, aliases and</text><text x="619" y="484.5" text-anchor="middle" font-size="15" fill="#14284b">tracked people</text><rect x="773.6666666666666" y="414.5" width="253.33333333333331" height="112" rx="14" fill="#dff3e3" stroke="#2e9e55" stroke-width="2.5"/><text x="900.3333333333333" y="457.5" text-anchor="middle" font-size="15" fill="#14284b">Official feeds, Google News</text><text x="900.3333333333333" y="475.5" text-anchor="middle" font-size="15" fill="#14284b">RSS, 9 sector feeds, company</text><text x="900.3333333333333" y="493.5" text-anchor="middle" font-size="15" fill="#14284b">profile</text><rect x="1055" y="414.5" width="253.33333333333331" height="112" rx="14" fill="#fdefd0" stroke="#e5a11a" stroke-width="2.5"/><text x="1181.6666666666667" y="466.5" text-anchor="middle" font-size="15" fill="#14284b">Safe fetch, real publish date,</text><text x="1181.6666666666667" y="484.5" text-anchor="middle" font-size="15" fill="#14284b">right investor? Dedupe</text><rect x="1336.3333333333333" y="551.5" width="253.33333333333331" height="112" rx="14" fill="#fcdcec" stroke="#d6307f" stroke-width="2.5"/><text x="1463" y="594.5" text-anchor="middle" font-size="15" fill="#14284b">Reads each page, returns the</text><text x="1463" y="612.5" text-anchor="middle" font-size="15" fill="#14284b">event and an exact quote. Never</text><text x="1463" y="630.5" text-anchor="middle" font-size="15" fill="#14284b">scores</text><rect x="492.3333333333333" y="688.5" width="253.33333333333331" height="112" rx="14" fill="#dcebfd" stroke="#2f80d8" stroke-width="2.5"/><text x="619" y="740.5" text-anchor="middle" font-size="15" fill="#14284b">Verified facts: quote found,</text><text x="619" y="758.5" text-anchor="middle" font-size="15" fill="#14284b">date within 30 days</text><rect x="773.6666666666666" y="688.5" width="253.33333333333331" height="112" rx="14" fill="#dff3e3" stroke="#2e9e55" stroke-width="2.5"/><text x="900.3333333333333" y="731.5" text-anchor="middle" font-size="15" fill="#14284b">Scoring rubric (editable),</text><text x="900.3333333333333" y="749.5" text-anchor="middle" font-size="15" fill="#14284b">relationship status, 30-day</text><text x="900.3333333333333" y="767.5" text-anchor="middle" font-size="15" fill="#14284b">window</text><rect x="1055" y="688.5" width="253.33333333333331" height="112" rx="14" fill="#fdefd0" stroke="#e5a11a" stroke-width="2.5"/><text x="1181.6666666666667" y="740.5" text-anchor="middle" font-size="15" fill="#14284b">Scores 100 points, picks the</text><text x="1181.6666666666667" y="758.5" text-anchor="middle" font-size="15" fill="#14284b">action, writes the why-now</text><rect x="1617.6666666666665" y="688.5" width="253.33333333333331" height="112" rx="14" fill="#fde0dc" stroke="#e5483b" stroke-width="2.5"/><text x="1744.3333333333333" y="740.5" text-anchor="middle" font-size="15" fill="#14284b">Score, action, why-now and</text><text x="1744.3333333333333" y="758.5" text-anchor="middle" font-size="15" fill="#14284b">sources saved as a snapshot</text><rect x="1055" y="825.5" width="253.33333333333331" height="112" rx="14" fill="#fdefd0" stroke="#e5a11a" stroke-width="2.5"/><text x="1181.6666666666667" y="868.5" text-anchor="middle" font-size="15" fill="#14284b">apply_assessment() updates only</text><text x="1181.6666666666667" y="886.5" text-anchor="middle" font-size="15" fill="#14284b">signal columns, hash before and</text><text x="1181.6666666666667" y="904.5" text-anchor="middle" font-size="15" fill="#14284b">after</text><rect x="1617.6666666666665" y="825.5" width="253.33333333333331" height="112" rx="14" fill="#fde0dc" stroke="#e5483b" stroke-width="2.5"/><text x="1744.3333333333333" y="877.5" text-anchor="middle" font-size="15" fill="#14284b">Your notes and contact history</text><text x="1744.3333333333333" y="895.5" text-anchor="middle" font-size="15" fill="#14284b">untouched; run receipt saved</text><rect x="1055" y="962.5" width="253.33333333333331" height="112" rx="14" fill="#fdefd0" stroke="#e5a11a" stroke-width="2.5"/><text x="1181.6666666666667" y="1014.5" text-anchor="middle" font-size="15" fill="#14284b">Digest email (Resend); code in</text><text x="1181.6666666666667" y="1032.5" text-anchor="middle" font-size="15" fill="#14284b">GitHub deploys to Vercel</text><rect x="1617.6666666666665" y="962.5" width="253.33333333333331" height="112" rx="14" fill="#fde0dc" stroke="#e5483b" stroke-width="2.5"/><text x="1744.3333333333333" y="1014.5" text-anchor="middle" font-size="15" fill="#14284b">Email in your inbox; live site</text><text x="1744.3333333333333" y="1032.5" text-anchor="middle" font-size="15" fill="#14284b">updated</text></svg>