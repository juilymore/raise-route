<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1112" viewBox="0 0 1900 1112" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0b3b3a"/></marker></defs>
<rect width="1900" height="1112" fill="#fff"/>
<text x="950" y="48" text-anchor="middle" font-size="36" font-weight="700" fill="#0b3b3a">RaiseRoute — How it works (Components Map)</text>
<rect x="15" y="78" width="1870" height="50" rx="10" fill="#0f766e"/>
<text x="106" y="110" text-anchor="middle" font-size="20" font-weight="600" fill="#fff">Actor</text><text x="337.66666666666663" y="110" text-anchor="middle" font-size="20" font-weight="600" fill="#fff">Trigger</text><text x="619" y="110" text-anchor="middle" font-size="20" font-weight="600" fill="#fff">Input</text><text x="900.3333333333333" y="110" text-anchor="middle" font-size="20" font-weight="600" fill="#fff">Context</text><text x="1181.6666666666667" y="110" text-anchor="middle" font-size="20" font-weight="600" fill="#fff">Processing</text><text x="1463" y="110" text-anchor="middle" font-size="20" font-weight="600" fill="#fff">AI</text><text x="1744.3333333333333" y="110" text-anchor="middle" font-size="20" font-weight="600" fill="#fff">Output</text><rect x="197" y="128" width="1688" height="137" fill="#e8f3f1"/><rect x="15" y="128" width="182" height="137" fill="#0b3b3a" stroke="#fff" stroke-width="1.5"/><text x="106" y="192.5" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">Vikram</text><text x="106" y="213.5" text-anchor="middle" font-size="13" fill="#bfe3dd">(you)</text><rect x="197" y="265" width="1688" height="137" fill="#eef0fb"/><rect x="15" y="265" width="182" height="137" fill="#0b3b3a" stroke="#fff" stroke-width="1.5"/><text x="106" y="329.5" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">Scheduler</text><text x="106" y="350.5" text-anchor="middle" font-size="13" fill="#bfe3dd">(starts the scan)</text><rect x="197" y="402" width="1688" height="137" fill="#fdf3e1"/><rect x="15" y="402" width="182" height="137" fill="#0b3b3a" stroke="#fff" stroke-width="1.5"/><text x="106" y="466.5" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">Source Collector</text><text x="106" y="487.5" text-anchor="middle" font-size="13" fill="#bfe3dd">(finds news and posts)</text><rect x="197" y="539" width="1688" height="137" fill="#f1eafc"/><rect x="15" y="539" width="182" height="137" fill="#0b3b3a" stroke="#fff" stroke-width="1.5"/><text x="106" y="603.5" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">Gemini Flash</text><text x="106" y="624.5" text-anchor="middle" font-size="13" fill="#bfe3dd">(AI reader)</text><rect x="197" y="676" width="1688" height="137" fill="#fdeee3"/><rect x="15" y="676" width="182" height="137" fill="#0b3b3a" stroke="#fff" stroke-width="1.5"/><text x="106" y="740.5" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">Rules Engine</text><text x="106" y="761.5" text-anchor="middle" font-size="13" fill="#bfe3dd">(scores and decides)</text><rect x="197" y="813" width="1688" height="137" fill="#e3f1f6"/><rect x="15" y="813" width="182" height="137" fill="#0b3b3a" stroke="#fff" stroke-width="1.5"/><text x="106" y="877.5" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">Database</text><text x="106" y="898.5" text-anchor="middle" font-size="13" fill="#bfe3dd">(stores everything</text><text x="106" y="914.5" text-anchor="middle" font-size="13" fill="#bfe3dd">safely)</text><rect x="197" y="950" width="1688" height="137" fill="#f6efe4"/><rect x="15" y="950" width="182" height="137" fill="#0b3b3a" stroke="#fff" stroke-width="1.5"/><text x="106" y="1014.5" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">Delivery</text><text x="106" y="1035.5" text-anchor="middle" font-size="13" fill="#bfe3dd">(email and website)</text><line x1="478.3333333333333" y1="128" x2="478.3333333333333" y2="1087" stroke="#fff" stroke-width="2"/><line x1="759.6666666666666" y1="128" x2="759.6666666666666" y2="1087" stroke="#fff" stroke-width="2"/><line x1="1041" y1="128" x2="1041" y2="1087" stroke="#fff" stroke-width="2"/><line x1="1322.3333333333333" y1="128" x2="1322.3333333333333" y2="1087" stroke="#fff" stroke-width="2"/><line x1="1603.6666666666665" y1="128" x2="1603.6666666666665" y2="1087" stroke="#fff" stroke-width="2"/><path d="M464.3333333333333 196.5 L478.3333333333333 196.5 L478.3333333333333 333.5 L492.3333333333333 333.5" fill="none" stroke="#0b3b3a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/><path d="M464.3333333333333 333.5 L492.3333333333333 333.5" fill="none" stroke="#0b3b3a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/><path d="M619 389.5 L619 414.5" fill="none" stroke="#0b3b3a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/><path d="M745.6666666666666 470.5 L773.6666666666666 470.5" fill="none" stroke="#0b3b3a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/><path d="M1027 470.5 L1055 470.5" fill="none" stroke="#0b3b3a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/><path d="M1308.3333333333333 470.5 L1322.3333333333333 470.5 L1322.3333333333333 607.5 L1336.3333333333333 607.5" fill="none" stroke="#0b3b3a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/><path d="M1463 663.5 L1463 676.5 L619 676.5 L619 688.5" fill="none" stroke="#0b3b3a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/><path d="M745.6666666666666 744.5 L773.6666666666666 744.5" fill="none" stroke="#0b3b3a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/><path d="M1027 744.5 L1055 744.5" fill="none" stroke="#0b3b3a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/><path d="M1308.3333333333333 744.5 L1617.6666666666665 744.5" fill="none" stroke="#0b3b3a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/><path d="M1181.6666666666667 800.5 L1181.6666666666667 825.5" fill="none" stroke="#0b3b3a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/><path d="M1308.3333333333333 881.5 L1617.6666666666665 881.5" fill="none" stroke="#0b3b3a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/><path d="M1744.3333333333333 688.5 L1744.3333333333333 252.5" fill="none" stroke="#0b3b3a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/><path d="M1744.3333333333333 937.5 L1744.3333333333333 950.5 L1181.6666666666667 950.5 L1181.6666666666667 962.5" fill="none" stroke="#0b3b3a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/><path d="M1308.3333333333333 1018.5 L1617.6666666666665 1018.5" fill="none" stroke="#0b3b3a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/><path d="M745.6666666666666 196.5 L759.6666666666666 196.5 L759.6666666666666 744.5 L773.6666666666666 744.5" fill="none" stroke="#0b3b3a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/><rect x="211" y="140.5" width="253.33333333333331" height="112" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/><text x="337.66666666666663" y="192.5" text-anchor="middle" font-size="15" fill="#0b3b3a">Opens RaiseRoute or presses Run</text><text x="337.66666666666663" y="210.5" text-anchor="middle" font-size="15" fill="#0b3b3a">now</text><rect x="492.3333333333333" y="140.5" width="253.33333333333331" height="112" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><text x="619" y="192.5" text-anchor="middle" font-size="15" fill="#0b3b3a">Updates notes, contact status,</text><text x="619" y="210.5" text-anchor="middle" font-size="15" fill="#0b3b3a">company and the scoring table</text><rect x="1617.6666666666665" y="140.5" width="253.33333333333331" height="112" rx="14" fill="#FFE5D1" stroke="#EA580C" stroke-width="2.5"/><text x="1744.3333333333333" y="192.5" text-anchor="middle" font-size="15" fill="#0b3b3a">Sees who to contact today, and</text><text x="1744.3333333333333" y="210.5" text-anchor="middle" font-size="15" fill="#0b3b3a">why, with sources</text><rect x="211" y="277.5" width="253.33333333333331" height="112" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/><text x="337.66666666666663" y="329.5" text-anchor="middle" font-size="15" fill="#0b3b3a">Every Monday and Thursday</text><text x="337.66666666666663" y="347.5" text-anchor="middle" font-size="15" fill="#0b3b3a">morning, or Run now</text><rect x="492.3333333333333" y="277.5" width="253.33333333333331" height="112" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><text x="619" y="329.5" text-anchor="middle" font-size="15" fill="#0b3b3a">Starts one scan with one small</text><text x="619" y="347.5" text-anchor="middle" font-size="15" fill="#0b3b3a">job per investor</text><rect x="492.3333333333333" y="414.5" width="253.33333333333331" height="112" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><text x="619" y="466.5" text-anchor="middle" font-size="15" fill="#0b3b3a">Investor names and the people</text><text x="619" y="484.5" text-anchor="middle" font-size="15" fill="#0b3b3a">we track</text><rect x="773.6666666666666" y="414.5" width="253.33333333333331" height="112" rx="14" fill="#CCEFEA" stroke="#0F766E" stroke-width="2.5"/><text x="900.3333333333333" y="457.5" text-anchor="middle" font-size="15" fill="#0b3b3a">Investor blogs, Google News,</text><text x="900.3333333333333" y="475.5" text-anchor="middle" font-size="15" fill="#0b3b3a">trade-press feeds, your company</text><text x="900.3333333333333" y="493.5" text-anchor="middle" font-size="15" fill="#0b3b3a">profile</text><rect x="1055" y="414.5" width="253.33333333333331" height="112" rx="14" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2.5"/><text x="1181.6666666666667" y="457.5" text-anchor="middle" font-size="15" fill="#0b3b3a">Opens each article, finds the</text><text x="1181.6666666666667" y="475.5" text-anchor="middle" font-size="15" fill="#0b3b3a">real date, checks the right</text><text x="1181.6666666666667" y="493.5" text-anchor="middle" font-size="15" fill="#0b3b3a">investor</text><rect x="1336.3333333333333" y="551.5" width="253.33333333333331" height="112" rx="14" fill="#EDE4FD" stroke="#7C3AED" stroke-width="2.5"/><text x="1463" y="594.5" text-anchor="middle" font-size="15" fill="#0b3b3a">Reads the article and notes</text><text x="1463" y="612.5" text-anchor="middle" font-size="15" fill="#0b3b3a">what happened, with an exact</text><text x="1463" y="630.5" text-anchor="middle" font-size="15" fill="#0b3b3a">quote. Never scores</text><rect x="492.3333333333333" y="688.5" width="253.33333333333331" height="112" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><text x="619" y="740.5" text-anchor="middle" font-size="15" fill="#0b3b3a">Checked facts: quote is on the</text><text x="619" y="758.5" text-anchor="middle" font-size="15" fill="#0b3b3a">page, date is within 30 days</text><rect x="773.6666666666666" y="688.5" width="253.33333333333331" height="112" rx="14" fill="#CCEFEA" stroke="#0F766E" stroke-width="2.5"/><text x="900.3333333333333" y="731.5" text-anchor="middle" font-size="15" fill="#0b3b3a">Your scoring table, your</text><text x="900.3333333333333" y="749.5" text-anchor="middle" font-size="15" fill="#0b3b3a">contact history, the 30-day</text><text x="900.3333333333333" y="767.5" text-anchor="middle" font-size="15" fill="#0b3b3a">window</text><rect x="1055" y="688.5" width="253.33333333333331" height="112" rx="14" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2.5"/><text x="1181.6666666666667" y="740.5" text-anchor="middle" font-size="15" fill="#0b3b3a">Gives a score from 0 to 100 and</text><text x="1181.6666666666667" y="758.5" text-anchor="middle" font-size="15" fill="#0b3b3a">picks one action</text><rect x="1617.6666666666665" y="688.5" width="253.33333333333331" height="112" rx="14" fill="#FFE5D1" stroke="#EA580C" stroke-width="2.5"/><text x="1744.3333333333333" y="740.5" text-anchor="middle" font-size="15" fill="#0b3b3a">Score, action and reason saved</text><text x="1744.3333333333333" y="758.5" text-anchor="middle" font-size="15" fill="#0b3b3a">for each investor</text><rect x="1055" y="825.5" width="253.33333333333331" height="112" rx="14" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2.5"/><text x="1181.6666666666667" y="868.5" text-anchor="middle" font-size="15" fill="#0b3b3a">Updates only the signal</text><text x="1181.6666666666667" y="886.5" text-anchor="middle" font-size="15" fill="#0b3b3a">columns. Before-and-after check</text><text x="1181.6666666666667" y="904.5" text-anchor="middle" font-size="15" fill="#0b3b3a">on your data</text><rect x="1617.6666666666665" y="825.5" width="253.33333333333331" height="112" rx="14" fill="#FFE5D1" stroke="#EA580C" stroke-width="2.5"/><text x="1744.3333333333333" y="877.5" text-anchor="middle" font-size="15" fill="#0b3b3a">Your notes and contact history</text><text x="1744.3333333333333" y="895.5" text-anchor="middle" font-size="15" fill="#0b3b3a">are exactly as you left them</text><rect x="1055" y="962.5" width="253.33333333333331" height="112" rx="14" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2.5"/><text x="1181.6666666666667" y="1014.5" text-anchor="middle" font-size="15" fill="#0b3b3a">Sends the email summary and</text><text x="1181.6666666666667" y="1032.5" text-anchor="middle" font-size="15" fill="#0b3b3a">updates the live website</text><rect x="1617.6666666666665" y="962.5" width="253.33333333333331" height="112" rx="14" fill="#FFE5D1" stroke="#EA580C" stroke-width="2.5"/><text x="1744.3333333333333" y="1014.5" text-anchor="middle" font-size="15" fill="#0b3b3a">Summary in your inbox; live</text><text x="1744.3333333333333" y="1032.5" text-anchor="middle" font-size="15" fill="#0b3b3a">site up to date</text></svg>